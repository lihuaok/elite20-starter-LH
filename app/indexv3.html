<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 编程助手 - v3</title>
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 35px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.2rem;
            color: #333;
            margin-bottom: 8px;
        }
        .header p {
            color: #666;
            font-size: 1.1rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        button {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .result {
            margin-top: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 12px;
            display: none;
        }
        .score {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .dimension {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .dimension-name {
            font-weight: 600;
            color: #333;
        }
        .dimension-score {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.1rem;
        }
        .list-group {
            margin-top: 20px;
        }
        .list-group h4 {
            margin-bottom: 10px;
            color: #333;
            font-size: 1.1rem;
        }
        .list-group ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .list-group li {
            padding: 10px 15px;
            margin-bottom: 6px;
            border-radius: 6px;
        }
        .list-group.strengths li {
            background: #d4edda;
            color: #155724;
        }
        .list-group.improvements li {
            background: #fff3cd;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>🤖 AI 编程助手 v3</h1>
            <p>智能代码分析与优化建议</p>
        </div>
        
        <div class="form-group">
            <label for="code">代码输入</label>
            <textarea id="code" placeholder="请粘贴您的代码..."></textarea>
        </div>
        
        <div class="form-group">
            <label for="lang">编程语言</label>
            <select id="lang">
                <option value="python">Python</option>
                <option value="javascript">JavaScript</option>
                <option value="java">Java</option>
            </select>
        </div>
        
        <button onclick="analyze()">开始分析</button>
        
        <div class="result" id="result">
            <div class="score">总体评分：<span id="overall">85</span>/100</div>
            
            <h3 style="margin-top: 20px; color: #333;">各维度评分</h3>
            <div id="dimensions">
                <div class="dimension">
                    <span class="dimension-name">代码理解</span>
                    <span class="dimension-score">90/100</span>
                </div>
                <div class="dimension">
                    <span class="dimension-name">逻辑分析</span>
                    <span class="dimension-score">80/100</span>
                </div>
                <div class="dimension">
                    <span class="dimension-name">调试技巧</span>
                    <span class="dimension-score">85/100</span>
                </div>
                <div class="dimension">
                    <span class="dimension-name">最佳实践</span>
                    <span class="dimension-score">85/100</span>
                </div>
                <div class="dimension">
                    <span class="dimension-name">架构设计</span>
                    <span class="dimension-score">80/100</span>
                </div>
            </div>
            
            <div class="list-group strengths">
                <h4>✅ 优点</h4>
                <ul>
                    <li>代码结构清晰，逻辑明确</li>
                    <li>变量命名符合规范</li>
                    <li>函数功能单一，职责明确</li>
                </ul>
            </div>
            
            <div class="list-group improvements">
                <h4>⚠️ 需要改进</h4>
                <ul>
                    <li>缺少类型提示</li>
                    <li>建议添加文档字符串</li>
                    <li>部分边界情况未处理</li>
                </ul>
            </div>
        </div>
    </div>
    
    <script>
        function analyze() {
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
